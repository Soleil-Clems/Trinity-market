# Chemin : .github/workflows/secrets-history.yml
# Scan gitleaks de TOUT l'historique git : à lancer une fois à la mise en place
# (Actions → Secrets — historique complet → Run workflow), puis chaque mois.
name: Secrets — historique complet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: gitleaks — historique complet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
      GITLEAKS_FULL: "1"
      CODE_SCANNING: ${{ (github.event.repository.private == false || vars.GHAS_ENABLED == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: bash .github/scripts/gitleaks-gate.sh
      - name: Publier dans l'onglet Security
        if: ${{ !cancelled() && env.CODE_SCANNING == 'true' && hashFiles('reports/gitleaks/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/gitleaks/gitleaks.sarif
          category: gitleaks-history