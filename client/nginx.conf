# Chemin : client/nginx.conf
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens     off;
    # Derrière Traefik : redirections relatives (/page → /page/) sans
    # exposer le port interne 8080 ni le schéma http.
    absolute_redirect off;

    # Compression faite par Traefik (zstd/br/gzip) : ne pas compresser ici,
    # sinon Traefik ne pourrait plus proposer brotli.
    gzip off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets Next.js hashés → immuables, cache 1 an
    location /_next/static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autres ressources statiques non hashées → 7 jours
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Pages HTML : toujours revalidées ; fallback SPA vers index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}