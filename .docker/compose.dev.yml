name: time-manager-dev

services:
  server:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.dev
      target: server
    environment:
      PORT: 3000
    ports:
      - "3001:3000"
    volumes:
      - ../server:/app
      - server_node_modules:/app/node_modules

  client:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.dev
      target: client
    ports:
      - "3000:3000"
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules

volumes:
  server_node_modules:
  client_node_modules:
